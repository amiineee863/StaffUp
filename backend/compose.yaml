services:
  postgres:
    image: postgres:17-alpine
    container_name: staffup-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - staffup-data:/var/lib/postgresql/data

volumes:
  staffup-data: